<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.className+=" js";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Talap. MESK preparation</title>
<meta name="description" content="Register, pick your language, and prepare for MESK with practice items, a study plan and an AI tutor.">
<meta name="theme-color" content="#062A3D">

<!--
  ==========================================================================
  TALAP, the app. index.html is the landing page, this file is the product.

  Flow: register  ->  choose language  ->  pick subjects  ->  app.

  WHERE YOUR API GOES
  Everything that would talk to a server lives in one object called Backend,
  near the top of the script. Every method has a TODO with the request it
  should make. Set API.enabled = true once your routes exist and nothing else
  in this file needs to change. You can also paste an endpoint at runtime in
  Settings, which is useful while you are testing.

  The AI tutor answers from a local demo engine until Backend.askTutor
  reaches your endpoint. The demo engine is real logic, not canned text: it
  reads intent, uses the student's own mastery data, marks written answers
  against assessment objectives, and generates practice questions.

  STORAGE
  State is held in memory so the demo runs anywhere, including previews that
  block browser storage. Search for "LocalStore" to switch on persistence
  when you host this yourself.
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz@6..72&display=swap">

<style>
:root{
  --night:#062A3D; --night-2:#0A3A51; --sea:#12556F; --live:#1E90AC;
  --gold:#D4A537; --gold-ink:#8A6413; --frost:#EDF2F5; --sheet:#F7FAFB;
  --ink:#08202D; --muted:#5C7181; --rule:#C9D7DE; --rule-dark:rgba(237,242,245,.20);
  --warn:#B2553A;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Public Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-read:"Newsreader",Georgia,"Times New Roman",serif;
  --r:2px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--frost);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-variation-settings:"wdth" 114;font-weight:700;
  letter-spacing:-.016em;line-height:1.06;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.7rem)}
h2{font-size:clamp(1.4rem,2.6vw,1.9rem)}
h3{font-size:1.12rem;font-weight:600}
h4{font-size:.98rem;font-weight:600}
p{margin:0 0 1em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--live);outline-offset:3px}

.lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lbl--gold{color:var(--gold-ink)}
.on-dark .lbl,.lbl--dark{color:#8FB0C0}

/* ------------------------------------------------------------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;
  border:1px solid transparent;border-radius:var(--r);font-weight:600;font-size:.95rem;
  text-decoration:none;cursor:pointer;transition:background-color .16s,border-color .16s,color .16s}
.btn--gold{background:var(--gold);color:#20180A;border-color:var(--gold)}
.btn--gold:hover{background:#E8BC4C}
.btn--solid{background:var(--night);color:var(--frost);border-color:var(--night)}
.btn--solid:hover{background:var(--sea)}
.btn--line{background:transparent;border-color:var(--rule);color:var(--ink)}
.btn--line:hover{border-color:var(--night);background:var(--sheet)}
.on-dark .btn--line,.card--dark .btn--line,.side .btn--line{border-color:var(--rule-dark);color:var(--frost)}
.on-dark .btn--line:hover,.card--dark .btn--line:hover,.side .btn--line:hover{border-color:var(--frost);background:rgba(255,255,255,.07)}
.btn--sm{padding:8px 13px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--wide{width:100%}

.field{display:grid;gap:6px;margin-bottom:16px}
.field>input,.field>select,.field>textarea{padding:12px;border:1px solid var(--rule);
  background:#fff;border-radius:var(--r);width:100%}
.field>input:disabled{background:var(--sheet);color:var(--muted)}
.on-dark .field>input,.on-dark .field>select{background:rgba(0,0,0,.16);border-color:var(--rule-dark);color:var(--frost)}
.err{color:var(--warn);font-size:.84rem;min-height:1.1em}
.on-dark .err{color:#F0B49B}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin-bottom:16px}
.check input{margin-top:4px;accent-color:var(--gold-ink)}

/* ------------------------------------------------------------- language */
.langbar{display:flex;gap:0;border:1px solid var(--rule-dark)}
.langbar button{background:transparent;border:0;border-right:1px solid var(--rule-dark);
  padding:7px 12px;font-size:.82rem;cursor:pointer;color:#A9C4D1}
.langbar button:last-child{border-right:0}
.langbar button[aria-pressed="true"]{background:var(--gold);color:#20180A;font-weight:600}
.langbar--light{border-color:var(--rule)}
.langbar--light button{border-right-color:var(--rule);color:var(--muted)}

/* ------------------------------------------------------------- screens */
.screen{display:none;min-height:100%}
.screen.is-on{display:block}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.auth__bar{display:flex;align-items:center;gap:18px;padding:16px clamp(18px,4vw,40px);
  background:var(--night);color:var(--frost)}
.auth__bar .langbar{margin-left:auto}
.mark{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:inherit}
.mark__d{width:7px;height:7px;background:var(--gold);border-radius:50%}
.mark__w{font-family:var(--f-display);font-variation-settings:"wdth" 122;font-weight:800;
  letter-spacing:.06em;font-size:1.08rem}
.auth__body{display:grid}
@media(min-width:960px){.auth__body{grid-template-columns:1.05fr .95fr}}
.auth__pitch{background:var(--night);color:var(--frost);padding:clamp(28px,5vw,68px);display:flex;
  flex-direction:column;justify-content:center}
.auth__pitch h1{color:#fff;max-width:16ch}
.auth__pitch p{color:#A9C4D1;max-width:44ch;margin-top:18px}
.auth__form{padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:center;
  max-width:560px;width:100%;margin-inline:auto}
.tabs2{display:flex;border:1px solid var(--rule);margin-bottom:26px}
.tabs2 button{flex:1;padding:12px;background:transparent;border:0;border-right:1px solid var(--rule);cursor:pointer;font-weight:600;font-size:.92rem}
.tabs2 button:last-child{border-right:0}
.tabs2 button[aria-selected="true"]{background:var(--night);color:var(--frost)}
.row2{display:grid;gap:0 16px}
@media(min-width:520px){.row2{grid-template-columns:1fr 1fr}}

/* onboarding */
.ob{min-height:100vh;background:var(--night);color:var(--frost);display:grid;grid-template-rows:auto 1fr}
.ob__body{max-width:820px;width:100%;margin-inline:auto;padding:clamp(26px,5vw,60px) clamp(18px,4vw,40px)}
.steps{display:flex;gap:8px;margin-bottom:34px}
.steps i{height:3px;flex:1;background:var(--rule-dark)}
.steps i.on{background:var(--gold)}
.pick{display:grid;gap:12px;margin:28px 0}
@media(min-width:640px){.pick--3{grid-template-columns:repeat(3,1fr)}}
.pick button{text-align:left;padding:18px;background:rgba(0,0,0,.16);border:1px solid var(--rule-dark);
  color:inherit;cursor:pointer;display:grid;gap:6px;transition:border-color .16s,background-color .16s}
.pick button:hover{border-color:var(--gold)}
.pick button[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,165,55,.14)}
.pick b{font-family:var(--f-display);font-variation-settings:"wdth" 114;font-size:1.15rem;font-weight:700}
.pick span{font-size:.86rem;color:#A9C4D1}
.ob__acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* app shell */
.shell{display:grid;min-height:100vh;grid-template-rows:auto 1fr auto}
@media(min-width:900px){.shell{grid-template-columns:248px 1fr;grid-template-rows:auto 1fr}}
.side{background:var(--night);color:var(--frost);display:flex;align-items:center;gap:16px;
  padding:12px clamp(16px,3vw,24px);border-bottom:1px solid var(--rule-dark)}
@media(min-width:900px){
  .side{grid-row:1/3;flex-direction:column;align-items:stretch;justify-content:flex-start;
    padding:22px 18px;border-bottom:0;border-right:1px solid var(--rule-dark);gap:0}
}
.side__nav{display:none}
@media(min-width:900px){.side__nav{display:grid;gap:2px;margin-top:34px}}
.side__nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;text-decoration:none;
  color:#A9C4D1;font-size:.94rem;border-left:2px solid transparent}
.side__nav a:hover{color:var(--frost);background:rgba(255,255,255,.05)}
.side__nav a[aria-current="page"]{color:var(--frost);border-left-color:var(--gold);background:rgba(255,255,255,.06)}
.side__nav em{font-family:var(--f-mono);font-style:normal;font-size:.7rem;color:var(--gold);width:18px}
.side__foot{display:none}
@media(min-width:900px){.side__foot{display:block;margin-top:auto;padding-top:20px;border-top:1px solid var(--rule-dark)}}
.side__me{display:flex;align-items:center;gap:10px;font-size:.88rem}
.avatar{width:30px;height:30px;background:var(--gold);color:#20180A;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:.85rem;flex:0 0 auto}

.top{display:flex;align-items:center;gap:14px;padding:12px clamp(16px,3vw,28px);
  background:var(--sheet);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.top h2{font-size:1.12rem}
.top .langbar{margin-left:auto}
.main{padding:clamp(20px,3.4vw,36px) clamp(16px,3vw,36px);max-width:1080px;width:100%}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--night);border-top:1px solid var(--rule-dark)}
@media(min-width:900px){.tabbar{display:none}}
.tabbar a{padding:11px 4px 13px;text-align:center;text-decoration:none;color:#8FB0C0;font-size:.68rem;
  display:grid;gap:3px;border-top:2px solid transparent}
.tabbar a[aria-current="page"]{color:var(--frost);border-top-color:var(--gold)}
.tabbar em{font-family:var(--f-mono);font-style:normal;font-size:.86rem}

/* cards */
.card{border:1px solid var(--rule);background:var(--sheet);padding:clamp(16px,2.4vw,26px)}
.card--dark{background:var(--night);color:var(--frost);border-color:var(--night)}
.card--dark .muted{color:#A9C4D1}
.grid{display:grid;gap:16px}
@media(min-width:760px){.grid--2{grid-template-columns:1.15fr .85fr}}
.stat{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.stat b{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-size:2.3rem;font-weight:700;line-height:1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.list__n{min-width:150px}
.list li:first-child{border-top:0}
.card--dark .list li{border-top-color:var(--rule-dark)}
.list__n{flex:1;font-size:.94rem}
.bar{width:88px;height:6px;background:#DFE9ED;flex:0 0 auto}
.card--dark .bar{background:rgba(255,255,255,.14)}
.bar i{display:block;height:100%;background:var(--sea);width:0;transition:width .8s cubic-bezier(.19,1,.22,1)}
.card--dark .bar i{background:var(--live)}
.bar i[data-low="1"]{background:var(--gold)}
.val{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:42px;text-align:right}
.card--dark .val{color:#A9C4D1}

/* grade band */
.gb{--pos:0%;position:relative;padding-top:32px;margin:14px 0 4px}
.gb__track{display:flex;height:26px;border:1px solid var(--rule)}
.gb__seg{flex:0 0 auto;width:var(--w);border-right:1px solid rgba(0,0,0,.3);display:grid;place-items:center}
.gb__seg:last-child{border-right:0}
.gb__seg b{font-family:var(--f-mono);font-size:.7rem;font-weight:500;color:rgba(255,255,255,.92)}
.gb__seg[data-g="U"]{background:#173A4B}.gb__seg[data-g="D"]{background:#1B4B62}
.gb__seg[data-g="C"]{background:#1D6A87}.gb__seg[data-g="B"]{background:#2288A8}
.gb__seg[data-g="A"]{background:#12556F}.gb__seg[data-g="A*"]{background:var(--gold)}
.gb__seg[data-g="A*"] b{color:#20180A}
.gb__pin{position:absolute;top:26px;height:38px;left:var(--pos);width:2px;background:var(--ink);
  transition:left .9s cubic-bezier(.19,1,.22,1)}
.card--dark .gb__pin{background:#fff}
.gb__flag{position:absolute;top:0;left:var(--pos);transform:translateX(-50%);white-space:nowrap;
  font-family:var(--f-mono);font-size:.7rem;background:var(--ink);color:#fff;padding:3px 8px;
  transition:left .9s cubic-bezier(.19,1,.22,1)}
.card--dark .gb__flag{background:#fff;color:var(--ink)}
.gb__scale{display:flex;margin-top:7px;font-family:var(--f-mono);font-size:.65rem;color:var(--muted)}
.gb__scale span{flex:0 0 auto;width:var(--w)}
.card--dark .gb__scale{color:#8FB0C0}

/* practice */
.q__meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px}
.q__stem{font-family:var(--f-read);font-size:1.12rem;line-height:1.5;margin:0 0 18px}
.opts{display:grid;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;background:#fff;
  border:1px solid var(--rule);cursor:pointer;transition:border-color .16s,background-color .16s}
.opt:hover{border-color:var(--sea)}
.opt[aria-pressed="true"]{border-color:var(--night);background:var(--sheet)}
.opt[data-state="right"]{border-color:var(--gold-ink);background:#FBF3DF}
.opt[data-state="wrong"]{border-color:var(--warn);background:#FBEDE9}
.opt__k{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.why{border-top:1px solid var(--rule);padding-top:14px;font-size:.94rem}
.verdict{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.verdict[data-ok="1"]{color:var(--gold-ink)}
.verdict[data-ok="0"]{color:var(--warn)}
.pgbar{height:3px;background:#DFE9ED;margin-bottom:20px}
.pgbar i{display:block;height:100%;background:var(--gold);transition:width .3s}

/* tutor */
.chat{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--sheet);
  height:min(72vh,680px)}
.chat__bar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.tag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:3px 8px;color:var(--muted)}
.tag--live{border-color:var(--gold-ink);color:var(--gold-ink)}
.chat__log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:min(66ch,95%);font-size:.95rem}
.msg p{margin:0 0 .7em}
.msg p:last-child{margin-bottom:0}
.msg--u{align-self:flex-end;background:var(--night);color:#EAF4F8;padding:11px 14px}
.msg--a{align-self:flex-start;border-left:2px solid var(--gold);padding-left:14px}
.msg--a.is-err{border-left-color:var(--warn)}
.msg .step{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
.msg .kv{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dotted var(--rule);padding:5px 0}
.msg .kv b{font-family:var(--f-mono);font-weight:500;font-size:.86rem}
.msg__acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg__acts button{background:transparent;border:1px solid var(--rule);padding:5px 10px;font-size:.78rem;
  cursor:pointer;color:var(--muted)}
.msg__acts button:hover{border-color:var(--night);color:var(--ink)}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--gold);vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.skel{align-self:flex-start;width:min(44ch,88%);display:grid;gap:8px;padding-left:16px;border-left:2px solid var(--rule)}
.skel i{height:10px;background:linear-gradient(90deg,#E1EAEE,#F2F7F9,#E1EAEE);background-size:200% 100%;
  animation:sweep 1.2s linear infinite}
.skel i:nth-child(2){width:86%}.skel i:nth-child(3){width:58%}
@keyframes sweep{to{background-position:-200% 0}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.chip{background:transparent;border:1px solid var(--rule);padding:7px 11px;font-size:.83rem;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--gold-ink);color:var(--ink)}
.chat__form{display:flex;gap:10px;align-items:flex-end;padding:13px 16px;border-top:1px solid var(--rule)}
.chat__form textarea{flex:1;resize:none;padding:11px 12px;border:1px solid var(--rule);background:#fff;
  min-height:52px;max-height:150px;font-size:.95rem;line-height:1.4;border-radius:var(--r)}
.chat__meta{display:flex;justify-content:space-between;gap:12px;padding:0 16px 12px;
  font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}

/* tables */
table{border-collapse:collapse;width:100%;min-width:540px}
.scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--rule);font-size:.92rem;vertical-align:top}
th{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;background:#E7EFF2}
tbody tr:last-child td{border-bottom:0}

.note{border:1px solid var(--rule);border-left:2px solid var(--gold);background:var(--sheet);
  padding:14px 16px;font-size:.88rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);
  color:var(--frost);padding:11px 18px;font-size:.9rem;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .2s}
.toast.is-on{opacity:1}
dialog{border:1px solid var(--rule);background:var(--frost);color:var(--ink);padding:0;
  max-width:min(680px,92vw);width:100%;border-radius:var(--r)}
dialog::backdrop{background:rgba(6,42,61,.68)}
.dlg__bar{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--night);color:var(--frost)}
.dlg__body{padding:20px;max-height:62vh;overflow-y:auto}
.dlg__body h4{margin:18px 0 6px}.dlg__body h4:first-child{margin-top:0}
.dlg__body p{font-size:.9rem;color:var(--muted)}
.dlg__x{margin-left:auto;background:none;border:1px solid var(--rule-dark);color:var(--frost);
  padding:6px 12px;cursor:pointer;font-size:.84rem}

@media (prefers-reduced-motion:reduce){
  .bar i,.gb__pin,.gb__flag,.pgbar i{transition:none}
  .skel i,.caret{animation:none}
}
/* must stay last: beats the display rules on .auth, .ob and .shell */
.screen:not(.is-on){display:none}
.auth.is-on,.ob.is-on{display:grid}
.shell.is-on{display:grid}
</style>
</head>
<body>

<!-- ============================================================ REGISTER -->
<section class="screen is-on auth" id="screenAuth">
  <div class="auth__bar on-dark">
    <a class="mark" href="index.html"><span class="mark__d"></span><span class="mark__w">TALAP</span></a>
    <div class="langbar" id="authLang" role="group" aria-label="Language"></div>
  </div>
  <div class="auth__body">
    <div class="auth__pitch on-dark">
      <p class="lbl lbl--dark" data-t="a.brandline"></p>
      <h1 data-t="a.h1" style="margin-top:16px"></h1>
      <p data-t="a.sub"></p>
      <div class="gb" id="authBand" style="max-width:420px">
        <div class="gb__flag mono">71, B</div><div class="gb__pin"></div>
        <div class="gb__track" id="authTrack"></div>
      </div>
    </div>

    <div class="auth__form">
      <div class="tabs2" role="tablist">
        <button type="button" role="tab" id="tabSignup" aria-selected="true" data-t="a.signup"></button>
        <button type="button" role="tab" id="tabLogin" aria-selected="false" data-t="a.login"></button>
      </div>

      <form id="formSignup" novalidate>
        <div class="field">
          <label class="lbl" for="suName" data-t="a.name"></label>
          <input id="suName" type="text" autocomplete="name" maxlength="60">
          <p class="err" id="errName"></p>
        </div>
        <div class="field">

/* ------------------------------------------------------------------------
   7. Helpers
   ------------------------------------------------------------------------ */
const $  = function(s,r){ return (r||document).querySelector(s); };
const $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
const SUBJ_BY_ID = new Map(SUBJECTS.map(function(s){ return [s.id, s]; }));

function t(key, vars){
  const dict = I18N[state.lang] || I18N.en;
  let out = dict[key] || I18N.en[key] || key;
  if (vars) for (const k in vars) out = out.split("{"+k+"}").join(vars[k]);
  return out;
}
function L(obj){
  if (!obj) return "";
  if (typeof obj === "string") return obj;
  return obj[state.lang] || obj.en || "";
}
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function gradeFor(score){
  for (let i = BOUNDS.length - 1; i >= 0; i--) if (score >= BOUNDS[i].from) return BOUNDS[i];
  return BOUNDS[0];
}
function subjectScore(id){
  const m = state.mastery[id]; const vals = Object.keys(m).map(function(k){ return m[k]; });
  return Math.round(vals.reduce(function(a,b){ return a+b; },0) / vals.length);
}
function weakestTopic(subjectId){
  const s = SUBJ_BY_ID.get(subjectId); const m = state.mastery[subjectId];
  let best = s.topics[0];
  s.topics.forEach(function(tp){ if (m[tp.id] < m[best.id]) best = tp; });
  return { subject:s, topic:best, v:m[best.id] };
}
function activeSubjects(){
  return SUBJECTS.filter(function(s){ return state.subjects.indexOf(s.id) !== -1; });
}
let toastTimer = null;
function toast(msg){
  const box = $("#toast");
  box.textContent = msg; box.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ box.classList.remove("is-on"); }, 2600);
}

/* grade band ------------------------------------------------------------ */
function buildBand(host, score, label){
  clear(host);
  const flag = el("div","gb__flag mono");
  const pin = el("div","gb__pin");
  const track = el("div","gb__track");
  BOUNDS.forEach(function(b){
    const seg = el("span","gb__seg"); seg.dataset.g = b.g;
    seg.style.setProperty("--w", b.w + "%");
    seg.appendChild(el("b", null, b.g));
    track.appendChild(seg);
  });
  const scale = el("div","gb__scale");
  BOUNDS.forEach(function(b){
    const s = el("span", null, String(b.from));
    s.style.setProperty("--w", b.w + "%"); scale.appendChild(s);
  });
  host.append(flag, pin, track, scale);
  const g = gradeFor(score);
  flag.textContent = label || (score + " " + t("c.marks") + ", " + g.g);
  track.setAttribute("role","img");
  track.setAttribute("aria-label", t("c.grade") + " " + g.g + ", " + score + "/100");
  host.style.setProperty("--pos","0%");
  const go = function(){ host.style.setProperty("--pos", score + "%"); };
  if (REDUCED) go(); else setTimeout(go, 120);
}

/* ------------------------------------------------------------------------
   8. Backend. Every server call in the app goes through here.
   ------------------------------------------------------------------------ */
const Backend = {
  url:function(p){ return (API.baseUrl || "") + p; },
  async post(path, body){
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, API.timeoutMs);
    try {
      const headers = { "Content-Type":"application/json" };
      if (API.token) headers["Authorization"] = "Bearer " + API.token;
      const res = await fetch(this.url(path), {
        method:"POST", headers:headers, body:JSON.stringify(body), signal:ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  },

  /* TODO: POST {name,email,password,school,grade} -> {token, user}
     Hash the password on the server, never here. */
  async register(payload){
    if (!API.enabled) { Store.set("account", payload); return { user:payload, token:"demo" }; }
    const data = await this.post(API.paths.register, payload);
    API.token = data.token; return data;
  },

  /* TODO: POST {email,password} -> {token, user} */
  async login(email, password){
    if (!API.enabled){
      const acc = Store.get("account");
      if (acc && acc.email === email && acc.password === password) return { user:acc, token:"demo" };
      throw new Error("credentials");
    }
    const data = await this.post(API.paths.login, { email:email, password:password });
    API.token = data.token; return data;
  },

  /* TODO: PUT or POST the chosen language, subjects, exam date and hours */
  async saveProfile(profile){
    if (!API.enabled) { Store.set("profile", profile); return { ok:true }; }
    return this.post(API.paths.profile, profile);
  },

  /* TODO: POST one answered item so the error log can be built server side */
  async saveAttempt(attempt){
    if (!API.enabled) return { ok:true };
    try { return await this.post(API.paths.attempt, attempt); }
    catch (e) { return { ok:false }; }
  },

  /* TODO: POST {messages, subject, lang, mastery} -> {reply:"..."}
     Your route adds the model key and the system prompt. See tutor-api-example.js */
  async askTutor(messages, ctx){
    const data = await this.post(API.paths.tutor, {
      messages: messages, subject: ctx.subject, lang: ctx.lang, mastery: ctx.mastery
    });
    const reply = typeof data.reply === "string" ? data.reply
      : (data.content && data.content[0] && data.content[0].text);
    if (!reply) throw new Error("no reply field");
    return reply;
  }
};

function buildLangBars(){

function applyStatic(){
  $$("[data-t]").forEach(function(n){ n.textContent = t(n.dataset.t); });

  state.lang = code;

  if ($("#screenApp").classList.contains("is-on")) route();

  const params = new URLSearchParams(location.search);
  const pre = params.get("email");
  if (pre) $("#suEmail").value = pre.slice(0,120);

  const tabS = $("#tabSignup"), tabL = $("#tabLogin");
  const formS = $("#formSignup"), formL = $("#formLogin");
  function pick(signup){
    tabS.setAttribute("aria-selected", String(signup));
    tabL.setAttribute("aria-selected", String(!signup));
    formS.hidden = !signup; formL.hidden = signup;
  }
  tabS.addEventListener("click", function(){ pick(true); });
  tabL.addEventListener("click", function(){ pick(false); });

  formS.addEventListener("submit", async function(ev){
    ev.preventDefault();
    const name = $("#suName").value.trim();
    const email = $("#suEmail").value.trim();
    const pass = $("#suPass").value;
    let bad = false;
    $("#errName").textContent = name ? "" : (bad = true, t("a.e.name"));
    $("#errEmail").textContent = EMAIL_RE.test(email) ? "" : (bad = true, t("a.e.email"));
    $("#errPass").textContent = pass.length >= 8 ? "" : (bad = true, t("a.e.pass"));
    $("#errAgree").textContent = $("#suAgree").checked ? "" : (bad = true, t("a.e.consent"));
    if (bad) return;
    const payload = { name:name, email:email, password:pass,
      school:$("#suSchool").value, grade:$("#suGrade").value };
    try {
      const res = await Backend.register(payload);
      state.user = res.user || payload;
      state.ob = 1;
      show("screenOb"); renderOnboard();
    } catch (e){ $("#errEmail").textContent = String(e.message || e); }
  });

  formL.addEventListener("submit", async function(ev){
    ev.preventDefault();
    try {
      const res = await Backend.login($("#liEmail").value.trim(), $("#liPass").value);
      state.user = res.user;
      const prof = Store.get("profile");
      if (prof){ state.subjects = prof.subjects; state.examDate = prof.examDate;
        state.hours = prof.hours; state.weakest = prof.weakest; state.lang = prof.lang || state.lang; }
      enterApp();
    } catch (e){ $("#errLogin").textContent = t("a.e.creds"); }
  });

  buildBand($("#authBand"), 71);
}

  $("#obStep").textContent = t("o.step", { n: state.ob });
  $$(".steps i").forEach(function(n,i){ n.classList.toggle("on", i < state.ob); });

  const p = el("p", null, t(state.ob === 1 ? "o.l.sub" : state.ob === 2 ? "o.s.sub" : "o.e.sub"));
  p.style.color = "#A9C4D1"; p.style.marginTop = "14px"; p.style.maxWidth = "52ch";

  if (state.ob === 1){
    const pick = el("div","pick pick--3");

      const b = el("button"); b.type = "button";
      b.setAttribute("aria-pressed", String(l.code === state.lang));
      b.append(el("b", null, l.native), el("span", null, l.label));
      b.addEventListener("click", function(){ setLang(l.code); });
      pick.appendChild(b);
    });
    host.appendChild(pick);
  }

  if (state.ob === 2){
    const pick = el("div","pick");
    SUBJECTS.forEach(function(s){
      const b = el("button"); b.type = "button";
      b.setAttribute("aria-pressed", String(state.subjects.indexOf(s.id) !== -1));
      const line = el("b", null, L(s.name));
      const sub = el("span", null, s.topics.map(function(tp){ return L(tp.n); }).slice(0,3).join(", "));
      b.append(line, sub);
      b.addEventListener("click", function(){
        const i = state.subjects.indexOf(s.id);
        if (i === -1) state.subjects.push(s.id); else state.subjects.splice(i,1);
        b.setAttribute("aria-pressed", String(i === -1));
        $("#obErr").textContent = "";
      });
      pick.appendChild(b);
    });
    host.appendChild(pick);
    const err = el("p","err"); err.id = "obErr"; host.appendChild(err);
  }

  if (state.ob === 3){
    const wrap = el("div"); wrap.style.maxWidth = "460px"; wrap.style.marginTop = "26px";
    const f1 = el("div","field");
    f1.append(Object.assign(el("label","lbl", t("o.date")), { htmlFor:"obDate" }));
    const d = el("input"); d.type = "date"; d.id = "obDate"; d.value = state.examDate; f1.appendChild(d);
    const f2 = el("div","field");
    f2.append(Object.assign(el("label","lbl", t("o.hoursWeek")), { htmlFor:"obHours" }));
    const hsel = el("select"); hsel.id = "obHours";
    [4,6,9,12].forEach(function(n){ const o = el("option", null, n + " " + t("c.hours").toLowerCase()); o.value = n; hsel.appendChild(o); });
    hsel.value = String(state.hours); f2.appendChild(hsel);
    const f3 = el("div","field");
    f3.append(Object.assign(el("label","lbl", t("o.weakest")), { htmlFor:"obWeak" }));
    const w = el("select"); w.id = "obWeak";
    activeSubjects().forEach(function(s){ const o = el("option", null, L(s.name)); o.value = s.id; w.appendChild(o); });
    if (state.subjects.indexOf(state.weakest) === -1) state.weakest = state.subjects[0];
    w.value = state.weakest; f3.appendChild(w);
    wrap.append(f1, f2, f3);
    host.appendChild(wrap);
  }

  const acts = el("div","ob__acts");
  if (state.ob > 1){
    const back = el("button","btn btn--line", t("c.back"));
    back.type = "button";
    back.addEventListener("click", function(){ state.ob -= 1; renderOnboard(); });
    acts.appendChild(back);
  }
  const next = el("button","btn btn--gold", t(state.ob === 3 ? "o.finish" : "c.continue"));
  next.type = "button";
  next.addEventListener("click", function(){
    if (state.ob === 2 && state.subjects.length === 0){ $("#obErr").textContent = t("o.e.subjects"); return; }
    if (state.ob === 3){
      state.examDate = $("#obDate").value || state.examDate;
      state.hours = Number($("#obHours").value) || 6;
      state.weakest = $("#obWeak").value;
      Backend.saveProfile({ lang:state.lang, subjects:state.subjects, examDate:state.examDate,
        hours:state.hours, weakest:state.weakest });
      enterApp();
      return;
    }
    state.ob += 1; renderOnboard();
  });
  acts.appendChild(next);
  host.appendChild(acts);
}

const NAV = [

function buildNav(){
  const side = $("#sideNav"), tab = $("#tabBar");
  clear(side); clear(tab);
  NAV.forEach(function(item, i){
    const a = el("a"); a.href = "#/" + item.id;
    a.append(el("em", null, String(i+1)), el("span", null, t(item.key)));
    side.appendChild(a);
    const b = el("a"); b.href = "#/" + item.id;
    b.append(el("em", null, String(i+1)), el("span", null, t(item.key)));
    tab.appendChild(b);
  });
}
function currentRoute(){
  const h = (location.hash || "").replace("#/","");
  return NAV.some(function(n){ return n.id === h; }) ? h : "home";
}
function route(){
  if (!state.user) return;
  const id = currentRoute();
  buildNav();
  $$("#sideNav a, #tabBar a").forEach(function(a){
    if (a.getAttribute("href") === "#/" + id) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  const item = NAV.filter(function(n){ return n.id === id; })[0];
  $("#viewTitle").textContent = t(item.key);
  const view = $("#view");
  clear(view);
  ({ home:viewHome, practice:viewPractice, tutor:viewTutor, plan:viewPlan, settings:viewSettings })[id](view);
}
function enterApp(){
  show("screenApp");
  $("#meName").textContent = state.user.name || state.user.email;
  $("#meGrade").textContent = t("a.gradeQ") + " " + (state.user.grade || "10");
  $("#avatar").textContent = (state.user.name || "A").trim().charAt(0).toUpperCase();
  if (!location.hash) location.hash = "#/home";
  route();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function renderMessage(log, m, animate){

  }

/* blocks are [label, text] pairs, or {kv:[a,b]} rows */
function paintBlocks(box, blocks, animate, log, msg){
  const stop = { cancelled:false };
  state.streaming = animate ? stop : null;
  let idx = 0;

  function paintOne(){
    if (idx >= blocks.length){
      state.streaming = null;
      if (msg && msg.role === "a" && !msg.err) addActions(box, msg);
      log.scrollTop = log.scrollHeight;
      return Promise.resolve();
    }
    const b = blocks[idx++];
    if (b && b.kv){
      const row = el("div","kv");
      row.append(el("b", null, b.kv[0]), el("span","mono", b.kv[1]));
      box.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return animate && !REDUCED ? wait(90).then(paintOne) : paintOne();
    }
    const label = b[0], text = b[1];
    const p = el("p");
    if (label) p.appendChild(el("span","step", label + ". "));
    box.appendChild(p);
    if (!animate || REDUCED){
      p.appendChild(document.createTextNode(text));
      log.scrollTop = log.scrollHeight;
      return paintOne();
    }
    return typeWords(p, text, stop, log).then(paintOne);
  }
  return paintOne();
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function typeWords(p, text, stop, log){
  const words = text.split(" ");
  const node = document.createTextNode("");
  p.appendChild(node);
  const caret = el("span","caret");
  p.appendChild(caret);
  let i = 0;
  return new Promise(function(resolve){
    function tick(){
      if (stop.cancelled){ node.textContent = text; caret.remove(); return resolve(); }
      const chunk = words.slice(i, i + 3).join(" ");
      node.textContent += (i ? " " : "") + chunk;
      i += 3;
      log.scrollTop = log.scrollHeight;
      if (i >= words.length){ caret.remove(); return resolve(); }
      setTimeout(tick, 42);
    }
    tick();
  });
}
function addActions(box, msg){
  const acts = el("div","msg__acts");
  [[t("t.simpler"), "simpler"], [t("t.similar"), "similar"], [t("c.copy"), "copy"]].forEach(function(pair){
    const b = el("button", null, pair[0]);
    b.type = "button";
    b.addEventListener("click", function(){
      if (pair[1] === "copy"){
        const text = msg.blocks.map(function(x){ return x.kv ? x.kv.join(": ") : x[1]; }).join("\n\n");
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        toast(t("c.copied"));
        return;
      }
      askTutor(pair[1] === "simpler" ? t("t.simpler") : t("t.similar"));
    });
    acts.appendChild(b);
  });
  box.appendChild(acts);
}

/* the demo engine ------------------------------------------------------- */
function pickIntent(text){
  const q = " " + text.toLowerCase() + " ";
  if (text.trim().split(/\s+/).length > 45) return "mark";
  for (const trig of MARK_TRIGGERS) if (q.indexOf(trig) !== -1) return "mark";
  for (const trig of QUESTION_TRIGGERS) if (q.indexOf(trig) !== -1) return "questions";
  for (const pair of INTENT_KEYS){
    for (const kw of pair[1]) if (q.indexOf(kw) !== -1) return pair[0];
  }
  return "fallback";
}
function demoBlocks(text){
  const intent = pickIntent(text);
  if (intent === "mark") return markWrittenAnswer(text);
  if (intent === "questions") return generateQuestions();
  const set = REPLIES[intent] || REPLIES.fallback;
  const rows = set[state.lang] || set.en;
  if (intent !== "fallback") return rows.map(function(r){ return [r[0], r[1]]; });
  const w = weakestTopic(state.ctx);
  return rows.map(function(r){
    return [r[0], r[1].split("{topic}").join(L(w.topic.n))
                      .split("{subject}").join(L(w.subject.name))
                      .split("{v}").join(String(w.v))];
  });
}
function markWrittenAnswer(text){
  const words = text.trim().split(/\s+/).length;
  const hasQuote = /["\u201c\u00ab][^"\u201d\u00bb]{4,}["\u201d\u00bb]/.test(text);
  const low = text.toLowerCase();
  let links = 0;
  LINKERS.forEach(function(k){ if (low.indexOf(k) !== -1) links += 1; });
  const sentences = text.split(/[.!?]+/).filter(function(s){ return s.trim().length > 3; }).length;

  const ao1 = clamp(1 + (words > 40 ? 1 : 0) + (words > 90 ? 1 : 0) + (hasQuote ? 1 : 0), 1, 4);
  const ao2 = clamp(1 + Math.min(3, links) + (hasQuote ? 1 : 0) + (words > 120 ? 1 : 0), 1, 6);
  const ao3 = clamp(1 + (sentences > 2 ? 1 : 0) + (sentences > 5 ? 1 : 0) + (words > 60 ? 1 : 0) + (words > 140 ? 1 : 0), 1, 5);
  const total = ao1 + ao2 + ao3;
  const band = clamp(Math.ceil(total / 15 * 5), 1, 5);
  const tip = !hasQuote ? t("t.mark.tip1") : (links < 2 ? t("t.mark.tip2") : t("t.mark.tip3"));

  return [
    ["", t("t.mark.h")],
    { kv:[t("t.mark.ao1"), ao1 + " / 4"] },
    { kv:[t("t.mark.ao2"), ao2 + " / 6"] },
    { kv:[t("t.mark.ao3"), ao3 + " / 5"] },
    { kv:[t("t.mark.band"), band + " / 5"] },
    ["", t("t.mark.next") + ": " + tip]
  ];
}
function generateQuestions(){
  const w = weakestTopic(state.ctx);
  const s = w.subject;
  let pool = s.items.filter(function(it){ return it.topic === w.topic.id; });
  if (pool.length < 3) pool = pool.concat(shuffled(s.items).filter(function(it){ return pool.indexOf(it) === -1; }));
  const three = pool.slice(0,3);
  const blocks = [["", L(s.name) + ", " + L(w.topic.n) + " (" + w.v + "%)"]];
  three.forEach(function(it, i){ blocks.push([String(i+1), L(it.stem)]); });
  blocks.push(["", t("t.q.foot")]);
  return blocks;
}

async function askTutor(raw){
  const text = String(raw || "").trim().slice(0, 4000);
  if (!text) return;
  if (state.streaming){ state.streaming.cancelled = true; state.streaming = null; }

  const now = Date.now();
  if (now - state.lastSend < 900) return;
  state.lastSend = now;

  const log = $("#chatLog");
  if (!log){ location.hash = "#/tutor"; setTimeout(function(){ askTutor(text); }, 80); return; }

  const input = $("#chatInput");
  if (input){ input.value = ""; input.style.height = "auto"; $("#chatCount").textContent = "0 / 4000"; }

  const userMsg = { role:"u", text:text };
  state.chat.push(userMsg);
  renderMessage(log, userMsg, false);

  const skel = el("div","skel");
  skel.setAttribute("role","status");
  skel.append(el("i"), el("i"), el("i"));
  log.appendChild(skel);
  log.scrollTop = log.scrollHeight;
  $("#chatSend").disabled = true;

  let blocks = null, err = false, live = false;

  if (API.enabled || API.baseUrl || state.tutorLive){
    try {
      const history = state.chat.slice(-10).map(function(m){
        return { role: m.role === "u" ? "user" : "assistant",
                 content: m.role === "u" ? m.text : m.blocks.map(function(b){ return b.kv ? b.kv.join(": ") : b[1]; }).join("\n\n") };
      });
      const reply = await Backend.askTutor(history, {
        subject: state.ctx, lang: state.lang, mastery: state.mastery[state.ctx]
      });
      blocks = String(reply).split(/\n{2,}/).map(function(p){ return ["", p]; });
      live = true;
    } catch (e){ err = true; }
  }

  if (!blocks && !err){
    await wait(520);
    blocks = demoBlocks(text);
  }
  if (err){ blocks = [["", t("t.err")]]; }

  skel.remove();
  state.tutorLive = live;
  const badge = $("#tutorBadge");
  if (badge){
    badge.textContent = live ? t("t.liveBadge") : t("t.demoBadge");
    badge.classList.toggle("tag--live", live);
  }
  const msg = { role:"a", blocks:blocks, err:err };
  state.chat.push(msg);
  await renderMessage(log, msg, true);
  $("#chatSend").disabled = false;
}

    });
    const weeks = Math.max(1, Math.round((new Date(state.examDate + "T00:00:00Z") - new Date()) / MS_WEEK));
    foot.textContent = t("pl.foot", { w:weeks, h:weeks * state.hours });
  }
  [d,h,w].forEach(function(n){ n.addEventListener("change", fill); });
  fill();
  view.appendChild(card);
}

/* ------------------------------------------------------------------------
   16. View, settings
   ------------------------------------------------------------------------ */
function viewSettings(view){
  const c1 = el("section","card");
  c1.append(el("h4", null, t("s.lang")));
  const bar = el("div","langbar langbar--light"); bar.style.marginTop = "12px"; bar.style.width = "fit-content";
  LANGS.forEach(function(l){
    const b = el("button", null, l.native); b.type = "button";
    b.setAttribute("aria-pressed", String(l.code === state.lang));
    b.addEventListener("click", function(){ setLang(l.code); });
    bar.appendChild(b);
  });
  c1.appendChild(bar);
  view.appendChild(c1);

  const c2 = el("section","card"); c2.style.marginTop = "16px";
  c2.append(el("h4", null, t("s.profile")));
  const ul = el("ul","list"); ul.style.marginTop = "10px";
  [[t("a.name"), state.user.name || "-"], [t("a.email"), state.user.email || "-"],
   [t("a.school"), state.user.school || "-"], [t("a.gradeQ"), state.user.grade || "-"],
   [t("d.done", { n:state.answered }), state.correct + " / " + state.answered]].forEach(function(p){
    const li = el("li");
    li.append(el("span","list__n", p[0]), el("span","mono", String(p[1])));
    ul.appendChild(li);
  });
  c2.appendChild(ul);
  view.appendChild(c2);

  const c3 = el("section","card"); c3.style.marginTop = "16px";
  c3.append(el("h4", null, t("s.api")));
  c3.append(el("p","muted", t("s.apiNote")));
  const f = el("div","field");
  const lab = el("label","lbl", t("s.endpoint")); lab.htmlFor = "apiUrl"; f.appendChild(lab);
  const inp = el("input"); inp.id = "apiUrl"; inp.type = "url";
  inp.placeholder = "https://api.yoursite.kz/api/tutor";
  inp.value = API.baseUrl ? API.baseUrl + API.paths.tutor : "";
  f.appendChild(inp);
  c3.appendChild(f);
  const acts = el("div"); acts.style.display = "flex"; acts.style.gap = "10px"; acts.style.flexWrap = "wrap";
  const test = el("button","btn btn--solid btn--sm", t("s.test")); test.type = "button";
  const help = el("button","btn btn--line btn--sm", t("s.help")); help.type = "button";
  acts.append(test, help); c3.appendChild(acts);
  const out = el("p","muted"); out.style.marginTop = "12px"; c3.appendChild(out);

  test.addEventListener("click", async function(){
    const url = inp.value.trim();
    if (!url){ out.textContent = t("s.fail"); return; }
    const u = new URL(url, location.href);
    API.baseUrl = u.origin;
    API.paths.tutor = u.pathname;
    out.textContent = "...";
    try {
      await Backend.askTutor([{ role:"user", content:"ping" }], { subject:state.ctx, lang:state.lang, mastery:{} });
      API.enabled = true; state.tutorLive = true;
      out.textContent = t("s.ok");
    } catch (e){
      API.enabled = false; state.tutorLive = false;
      out.textContent = t("s.fail");
    }
  });
  help.addEventListener("click", function(){ openApiHelp(); });
  view.appendChild(c3);

  const c4 = el("section","card"); c4.style.marginTop = "16px";
  c4.append(el("h4", null, t("s.data")));
  const acts2 = el("div"); acts2.style.display = "flex"; acts2.style.gap = "10px";
  acts2.style.flexWrap = "wrap"; acts2.style.marginTop = "12px";
  const exp = el("button","btn btn--line btn--sm", t("s.export")); exp.type = "button";
  exp.addEventListener("click", function(){
    const data = JSON.stringify({ user:state.user, subjects:state.subjects, mastery:state.mastery,
      answered:state.answered, correct:state.correct, examDate:state.examDate, hours:state.hours }, null, 2);
    const blob = new Blob([data], { type:"application/json" });
    const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "talap-data.json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  const wipe = el("button","btn btn--line btn--sm", t("s.wipe")); wipe.type = "button";
  wipe.addEventListener("click", function(){
    Store.clear(); state.chat = []; state.answered = 0; state.correct = 0;
    SUBJECTS.forEach(function(s){ s.topics.forEach(function(tp){ state.mastery[s.id][tp.id] = tp.v; }); });
    toast(t("s.wipeDone")); route();
  });
  acts2.append(exp, wipe); c4.appendChild(acts2);
  c4.appendChild(el("p","note", t("s.about")));
  view.appendChild(c4);
}

function openApiHelp(){
  const body = $("#dlgApiBody");
  clear(body);
  const rows = [
    ["1. Create the route", "Your server exposes POST /api/tutor. It receives {messages, subject, lang, mastery} and returns {reply: \"...\"}. Nothing else in this file has to change."],
    ["2. Keep the key on the server", "The model key is read from an environment variable inside that route. If the key ever appears in this file, anyone can open dev tools and take it."],
    ["3. Add auth and a rate limit", "Check the session token before calling the model, and cap requests per user per minute. The limit in this file is cosmetic, a browser cannot enforce anything."],
    ["4. Point the app at it", "Paste the full URL in the field above and press the test button, or set API.baseUrl and API.enabled at the top of the script."],
    ["5. Validate the input", "Cap message length and count on the server, reject anything that is not a string, and log failures without storing the full text of student answers."]
  ];
  rows.forEach(function(r){ body.append(el("h4", null, r[0]), el("p", null, r[1])); });
  const d = $("#dlgApi");
  if (d.showModal) d.showModal();
}

/* ------------------------------------------------------------------------
   17. Boot
   ------------------------------------------------------------------------ */
$$("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ b.closest("dialog").close(); });
});
$$("dialog").forEach(function(d){
  d.addEventListener("click", function(ev){ if (ev.target === d) d.close(); });
});
$("#signOut").addEventListener("click", function(){
  state.user = null; state.chat = []; practice.running = false;
  location.hash = ""; show("screenAuth");
});
window.addEventListener("hashchange", route);

buildLangBars();
applyStatic();
initAuth();
show("screenAuth");

})();
</script>
